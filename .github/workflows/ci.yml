name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Yarn 4 comes from Corepack (package.json "packageManager"), which isn't enabled yet at this step.
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
        env:
          HUSKY: '0'
      # Typecheck, lint, format, engine tests, Vega smoke tests and Android remote tests.
      - run: yarn check
